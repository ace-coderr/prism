# Keeps the vibe/vibe launch index fresh: every 30 minutes it reads the new blocks from Robinhood
# Chain Testnet (public RPC, read-only) and republishes launches.json.gz as an asset of the
# "launch-index" release, which /api/launches serves, plus launch-meta.json.gz (every launch's
# verified metadata, which /api/meta serves) and launch-xray.json.gz (what each recent launch's
# creator has done with their own tokens, which the X-ray's feed and flags use). Free for public
# repos; the only credential is the workflow's own short-lived GITHUB_TOKEN (no secrets to set up).
name: Launch index

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write # publish the release asset

concurrency:
  group: launch-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 180 # a first build reads ~223k launches (hours); later runs take a few minutes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Download the previous index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download launch-index --pattern launches.json.gz --dir prev || echo "No previous index, so this is a first build"
      - name: Read the new blocks
        run: npx tsx packages/core/scripts/index-launches.ts prev/launches.json.gz launches.json.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view launch-index >/dev/null 2>&1 || gh release create launch-index --prerelease --latest=false \
            --title "Launch index (data)" \
            --notes "Every vibe/vibe launch on Robinhood Chain Testnet, read from the chain. Updated automatically by .github/workflows/launch-index.yml; served by /api/launches."
          gh release upload launch-index launches.json.gz --clobber
      # every launch's verified metadata, kept for good (IPFS content never changes): carries over the
      # previous cache and reads the launches it doesn't have yet, newest first (never fails the job)
      - name: Cache token metadata
        continue-on-error: true
        timeout-minutes: 18
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download launch-index --pattern launch-meta.json.gz --dir prev || echo "No previous metadata cache, so this starts one"
          npx tsx packages/core/scripts/cache-metadata.ts launches.json.gz prev/launch-meta.json.gz launch-meta.json.gz --minutes 12
          gh release upload launch-index launch-meta.json.gz --clobber
      # what every launch of the last week's creator has done with their own tokens: two filtered
      # queries each, so thousands fit in the budget. Then it warms the X-ray of the newest launches
      # and the ones people opened recently, so no visitor pays for the first cold read.
      - name: Watch creators and warm the X-ray
        continue-on-error: true
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download launch-index --pattern launch-xray.json.gz --dir prev || echo "No previous creator watch, so this starts one"
          npx tsx packages/core/scripts/warm-xray.ts launches.json.gz prev/launch-xray.json.gz launch-xray.json.gz https://seeprism.xyz --minutes 14
          gh release upload launch-index launch-xray.json.gz --clobber
      # visitors rarely wait for IPFS: fetch the pictures of the newest, most traded, recently graduated
      # and reviewed launches through the site so its cache has them (never fails the job)
      - name: Warm token pictures
        continue-on-error: true
        timeout-minutes: 25
        run: npx tsx packages/core/scripts/warm-pictures.ts launches.json.gz https://seeprism.xyz --minutes 20
